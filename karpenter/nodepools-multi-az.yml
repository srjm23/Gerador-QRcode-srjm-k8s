apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot-us-east-2a
spec:
  weight: 100
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
  limits:
    cpu: "14"
    memory: 24Gi
  template:
    metadata:
      labels:
        workload-tier: general
    spec:
      expireAfter: 720h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t3.small
            - t3.medium
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-2a
