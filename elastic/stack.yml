apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: logs
  namespace: elastic-stack
spec:
  version: 9.4.3
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: -Xms512m -Xmx512m
              resources:
                requests:
                  cpu: 250m
                  memory: 768Mi
                limits:
                  cpu: "1"
                  memory: 1280Mi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
            storageClassName: gp2
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: logs
  namespace: elastic-stack
spec:
  version: 9.4.3
  count: 1
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  elasticsearchRef:
    name: logs
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: cluster-logs
  namespace: elastic-stack
spec:
  type: filebeat
  version: 9.4.3
  elasticsearchRef:
    name: logs
  config:
    filebeat.inputs:
      - type: filestream
        id: kubernetes-container-logs
        paths:
          - /var/log/containers/*.log
        parsers:
          - container:
              stream: all
        prospector.scanner.symlinks: true
    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: /var/log/containers/
    setup.ilm.enabled: true
    setup.ilm.policy_name: kubernetes-logs-2d
    setup.ilm.policy_file: /usr/share/filebeat/ilm/policy.json
    setup.ilm.overwrite: false
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: cluster-logs-filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        securityContext:
          runAsUser: 0
        containers:
          - name: filebeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                cpu: 250m
                memory: 300Mi
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true
              - name: ilm-policy
                mountPath: /usr/share/filebeat/ilm
                readOnly: true
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
          - name: ilm-policy
            configMap:
              name: filebeat-ilm-policy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-ilm-policy
  namespace: elastic-stack
data:
  policy.json: |
    {
      "policy": {
        "phases": {
          "hot": {
            "actions": {}
          },
          "delete": {
            "min_age": "2d",
            "actions": {
              "delete": {}
            }
          }
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-logs-filebeat
  namespace: elastic-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-logs-filebeat
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - namespaces
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-logs-filebeat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-logs-filebeat
subjects:
  - kind: ServiceAccount
    name: cluster-logs-filebeat
    namespace: elastic-stack
